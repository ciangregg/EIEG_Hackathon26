5, -6.6816791], [54.5119455, -6.6816791]]}, {"id": "T90310-90320-90362-1-w2", "bus0": "star:90310-90320-90362-1", "bus1": "90320", "coords": [[54.5119455, -6.6816791], [54.5119455, -6.6816791]]}];

const networkBounds = [[51.7232312, -9.6927788], [55.1478388, -5.6724001]];


// ==========================================================
// Create map
// ==========================================================

const map = L.map("map");


L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 19,

        attribution:
            "&copy; OpenStreetMap contributors"
    }
).addTo(map);


// Zoom to network

map.fitBounds(
    networkBounds,
    {
        padding: [20, 20]
    }
);


// ==========================================================
// Voltage colours
// ==========================================================

function voltageColour(voltage) {

    if (voltage >= 400)
        return "#7b1fa2";

    if (voltage >= 275)
        return "#d32f2f";

    if (voltage >= 200)
        return "#f57c00";

    if (voltage >= 100)
        return "#1976d2";

    return "#388e3c";
}


// ==========================================================
// HTML escaping
// ==========================================================

function escapeHTML(value) {

    return String(value ?? "")
        .replace(
            /[&<>"']/g,
            character => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            })[character]
        );
}


// ==========================================================
// Layers
// ==========================================================

const lineLayer =
    L.layerGroup().addTo(map);

const transformerLayer =
    L.layerGroup().addTo(map);

const busLayer =
    L.layerGroup().addTo(map);


// ==========================================================
// Transmission lines
// ==========================================================

lines.forEach(line => {

    const voltage =
        line.voltage || 0;


    const polyline = L.polyline(
        line.coords,
        {
            color: voltageColour(voltage),

            weight: 2.5,

            opacity: 0.75
        }
    );


    polyline.bindPopup(

        "<b>Transmission Line</b>" +

        "<br>ID: " +
        escapeHTML(line.id) +

        "<br>From: " +
        escapeHTML(line.bus0) +

        "<br>To: " +
        escapeHTML(line.bus1) +

        "<br>Nominal voltage: " +
        voltage +
        " kV" +

        "<br>Rating: " +
        (
            line.rating === null
            ? "—"
            : line.rating + " MVA"
        ) +

        "<br>Carrier: " +
        escapeHTML(line.carrier)
    );


    polyline.addTo(lineLayer);

});


// ==========================================================
// Transformers
// ==========================================================

transformers.forEach(transformer => {

    const polyline = L.polyline(

        transformer.coords,

        {
            color: "#444444",

            weight: 2,

            opacity: 0.6,

            dashArray: "5, 5"
        }
    );


    polyline.bindPopup(

        "<b>Transformer</b>" +

        "<br>ID: " +
        escapeHTML(transformer.id) +

        "<br>From: " +
        escapeHTML(transformer.bus0) +

        "<br>To: " +
        escapeHTML(transformer.bus1)
    );


    polyline.addTo(transformerLayer);

});


// ==========================================================
// Buses
// ==========================================================

buses.forEach(bus => {

    const voltage =
        bus.voltage || 0;


    const marker = L.circleMarker(

        [bus.lat, bus.lon],

        {

            radius: 3.5,

            color:
                voltageColour(voltage),

            weight: 1,

            fillOpacity: 0.9

        }
    );


    marker.bindPopup(

        "<b>Bus / Substation</b>" +

        "<br>ID: " +
        escapeHTML(bus.id) +

        "<br>Voltage: " +
        (
            bus.voltage === null
            ? "—"
            : bus.voltage + " kV"
        ) +

        "<br>Station: " +
        (
            escapeHTML(bus.station)
            || "—"
        ) +

        "<br>Jurisdiction: " +
        (
            escapeHTML(bus.jurisdiction)
            || "—"
        )

    );


    marker.addTo(busLayer);

});


// ==========================================================
// Layer control
// ==========================================================

L.control.layers(

    null,

    {
        "Transmission lines":
            lineLayer,

        "Transformers":
            transformerLayer,

        "Buses / substations":
            busLayer
    },

    {
        collapsed: false
    }

).addTo(map);


// ==========================================================
// Legend
// ==========================================================

const legend =
    L.control({
        position: "bottomright"
    });


legend.onAdd = function () {

    const div =
        L.DomUtil.create(
            "div",
            "legend"
        );


    div.innerHTML =

        "<b>Nominal Voltage</b><br>" +

        '<i style="background:#7b1fa2"></i>' +
        "400+ kV<br>" +

        '<i style="background:#d32f2f"></i>' +
        "275–399 kV<br>" +

        '<i style="background:#f57c00"></i>' +
        "200–274 kV<br>" +

        '<i style="background:#1976d2"></i>' +
        "100–199 kV<br>" +

        '<i style="background:#388e3c"></i>' +
        "&lt;100 kV";


    return div;
};


legend.addTo(map);


</script>
